{{- if and .Values.operator.enabled .Values.capture.serviceAccount.name .Values.capture.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.capture.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "retina.labels" . | nindent 4 }}
    app.kubernetes.io/component: capture
{{- end }}
